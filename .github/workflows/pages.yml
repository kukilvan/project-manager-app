name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The server tests run against a real PocketBase (tests/pb-server.test.js); PB_TESTS_REQUIRED makes a missing binary fail them
      - uses: actions/cache@v4
        with:
          path: .cache/pocketbase
          key: pocketbase-0.42.3-linux_amd64
      - run: node tools/pb-dev.mjs fetch
      - run: npm test
        env:
          PB_TESTS_REQUIRED: '1'
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
