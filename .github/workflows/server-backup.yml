name: Server backup

# Every 2 days at 08:30 UTC (right after the daily Firebase quota reset, ~10:00 Israel time) a copy of all projects goes to the private repo kukilvan/polevoy-backups
# and to the owner's Google Drive (the file «Автокопия данных (обновляется каждые 2 дня).zip» in the folder «Полевой журнал»).
on:
  schedule:
    - cron: '30 8 */2 * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # lets the job renew its own schedule (GitHub disables a schedule after 60 days without activity)

concurrency:
  group: server-backup

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save firebase-admin@13 google-auth-library@9
      - uses: actions/checkout@v4
        with:
          repository: kukilvan/polevoy-backups
          token: ${{ secrets.BACKUP_REPO_TOKEN }}
          path: backups
      - name: Сделать копию
        run: node scripts/server-backup.mjs backups
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Сохранить копию в закрытый репозиторий
        working-directory: backups
        run: |
          git config user.name "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Копия $(date -u +%Y-%m-%d_%H%M)"
          git push
      - name: Очистка (удаляет навсегда то, что удалено больше года назад)
        run: node scripts/server-cleanup.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Копия на Google Диск (вне GitHub)
        run: node scripts/server-drive-backup.mjs backups
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Продлить расписание
        if: always()
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/server-backup.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
